<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found</title>
    <!-- A top-level 404.html also turns off Cloudflare Pages' single-page-app fallback, which answered
         every unknown URL with the home page and a 200, so crawlers could follow relative links forever -->
    <meta name="robots" content="noindex">
    <link rel="icon" href="/assets/images/favicon.png">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 16px;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #171A21;
            color: #dbdbdb;
            line-height: 1.5;
        }
        main { max-width: 32rem; display: flex; flex-direction: column; gap: 1rem; }
        h1 { margin: 0; font-size: 1.6rem; }
        p { margin: 0; color: #939393; }
        a {
            display: block;
            text-align: center;
            padding: 0.9rem 1rem;
            border-radius: 0.6rem;
            background: #7e4baa;
            color: #fff;
            font-weight: 600;
            text-decoration: none;
        }
        a:hover { filter: brightness(1.1); }
    </style>
</head>
<body>
<main>
    <h1>Page not found</h1>
    <p>This old site moved to specy.app, where you'll find all of Specy's apps, projects and the blog.</p>
    <a href="https://specy.app/">Go to specy.app</a>
</main>
</body>
</html>
